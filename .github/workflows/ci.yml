name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest

  package:
    # The wheel must work where the checkout is not. Build both distributions,
    # check the metadata renders, install the wheel into a bare environment, and
    # run the suite and the console script against the installed package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl pytest
      - name: Run the suite against the installed wheel
        run: /tmp/wheel-env/bin/pytest
      - name: Smoke-test the console script
        run: |
          /tmp/wheel-env/bin/judgepanel version
          /tmp/wheel-env/bin/judgepanel simulate --judges 0.9:0.95,0.8:0.85,0.7:0.9 --items 200 --prevalence 0.3 --seed 7
          /tmp/wheel-env/bin/judgepanel fit examples/data/demo_panel.jsonl --positive faulty
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
