[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgepanel"
version = "0.1.0"
description = "Estimate LLM-judge accuracy without gold labels and aggregate judge panels: Dawid-Skene EM, agreement statistics, bootstrap uncertainty"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hadi Mohammadi" }]
requires-python = ">=3.12"
keywords = [
  "llm-as-judge",
  "dawid-skene",
  "label-aggregation",
  "inter-rater-agreement",
  "annotation",
  "evaluation",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/mohammadi-hadi/judgepanel"
Issues = "https://github.com/mohammadi-hadi/judgepanel/issues"
DOI = "https://doi.org/10.5281/zenodo.21809473"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=6.1",
]

[project.scripts]
judgepanel = "judgepanel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/judgepanel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
